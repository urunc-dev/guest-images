name: Build images

# Builds every image laid out as
#   <app>/<framework>/<monitor>/<rootfs>/bunnyfile-<arch>
# where <rootfs> is the rootfs type: raw, block, initrd, or no_rootfs for
# unikernels without one. The directory holding the bunnyfiles is the image
# directory. Sources and scripts shared by an app's images live in
# <app>/src. On push and pull_request only the images whose inputs changed
# are built; pull requests build without pushing. Apps still in the old
# flat layout are built by oci.yml.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Build all images, or only the ones changed against base"
        type: choice
        options: [all, changed]
        default: all
      base:
        description: "Ref to diff against in changed mode"
        type: string
        default: origin/main
      filter:
        description: "Only build paths under this prefix (e.g. chttp or chttp/unikraft/qemu)"
        type: string
        default: ''

permissions:
  id-token: write # for signing the manifest
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover images to build
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Turns every image directory into one matrix entry with its arches, e.g.
    #   [{"app":"chttp","framework":"unikraft","monitor":"qemu","rootfs":"initrd","arches":["amd64"]}]
    # A bunnyfile missing the <rootfs> level fails discovery rather than being
    # skipped.
    #
    # MODE decides which of the discovered images are built:
    # - "all" (workflow_dispatch only) builds every image, narrowed by FILTER.
    # - "changed" (always on push and pull_request) builds only the images
    #   whose inputs changed between BASE and HEAD: a file directly in the
    #   image directory (bunnyfiles, prebuild.sh) or anywhere under
    #   <app>/src. The other images are not rebuilt and their published
    #   images stay as they are. If BASE cannot be resolved (e.g. the
    #   all-zero "before" of a new branch) or the build workflows themselves
    #   changed, every image is built.
    - name: Discover images
      id: scan
      env:
        MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'changed' }}
        BASE: >-
          ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
          || github.event_name == 'push' && github.event.before
          || inputs.base }}
        FILTER: ${{ inputs.filter }}
      run: |
        set -euo pipefail

        COMBOS=$(find . -mindepth 4 -maxdepth 5 -type f -name 'bunnyfile-*' -not -path './.*' \
          | sed 's|^\./||' | sort)

        CHANGED_FILES=null
        if [ "$MODE" = changed ]; then
          if [ -n "$BASE" ] && git rev-parse --verify -q "${BASE}^{commit}" > /dev/null; then
            # --no-renames lists both sides of a rename, so moving a file out
            # of a directory still rebuilds what it used to belong to.
            CHANGED=$(git diff --name-only --no-renames "${BASE}...HEAD")
            if ! grep -qE '^\.github/workflows/build(_and_manifest)?\.yml$' <<< "$CHANGED"; then
              CHANGED_FILES=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$CHANGED")
            fi
          else
            echo "Cannot resolve base '${BASE}', building everything"
          fi
        fi

        MATRIX=$(jq -R -s -c --argjson changed "$CHANGED_FILES" --arg filter "$FILTER" '
          def dirname: split("/") | .[0:-1] | join("/");

          split("\n")
          | map(select(length > 0))
          # <app>/src is the shared build context, not an image
          | map(select((split("/") | .[1]) != "src"))
          | map(select(($filter == "") or ((. + "/") | startswith(($filter | rtrimstr("/")) + "/"))))
          | map(
              . as $path
              | split("/") as $p
              | if ($p | length) != 5
                then error("\($path): expected <app>/<framework>/<monitor>/<rootfs>/bunnyfile-<arch>")
                else . end
              | ($p[-1] | capture("^bunnyfile-(?<arch>amd64|arm64)$")
                 // error("\($path): expected bunnyfile-<amd64|arm64>")) as $f
              | {app: $p[0], framework: $p[1], monitor: $p[2], rootfs: $p[3],
                 dir: ($path | dirname), arch: $f.arch}
            )
          | map(select(
              ($changed == null)
              or (. as $img | any($changed[]; startswith($img.app + "/src/") or dirname == $img.dir))
            ))
          | group_by(.dir)
          | map(.[0] + {arches: map(.arch)} | del(.arch, .dir))
        ' <<< "$COMBOS")

        echo "Images to build: $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }}/${{ matrix.framework }}/${{ matrix.monitor }}/${{ matrix.rootfs }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build_and_manifest.yml
    with:
      app: ${{ matrix.app }}
      framework: ${{ matrix.framework }}
      monitor: ${{ matrix.monitor }}
      rootfs: ${{ matrix.rootfs }}
      arches: ${{ toJSON(matrix.arches) }}
      push: ${{ github.event_name != 'pull_request' }}
